<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>广场 - 公益摄影交流平台</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <style>
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#020617; color:#e5e7eb; }
    .top { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:#020617; border-bottom:1px solid rgba(148,163,184,.25); position:sticky; top:0; z-index:10; }
    .logo { font-weight:800; cursor:pointer; color:#fff; }
    .nav { display:flex; gap:12px; align-items:center; }
    .btn { padding:8px 12px; border-radius:10px; background:rgba(15,23,42,1); border:1px solid rgba(148,163,184,.4); color:#e5e7eb; cursor:pointer; font-size:14px; }
    .btn.primary { background:#22c55e; border:none; color:#022c22; }
    .profile { display:flex; align-items:center; gap:10px; cursor:pointer; }
    .avatar { width:34px; height:34px; border-radius:12px; background:rgba(15,23,42,1); overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .container { max-width:1120px; margin:18px auto; padding:0 18px; }
    .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
    .pill { padding:6px 10px; border-radius:999px; font-size:13px; border:1px solid rgba(148,163,184,.6); background:rgba(15,23,42,1); cursor:pointer; }
    .pill.active { background:#22c55e; color:#022c22; border-color:#22c55e; }
    .pill-outline { padding:4px 8px; border-radius:999px; font-size:12px; border:1px solid rgba(148,163,184,.5); cursor:pointer; }
    .pill-outline.active { background:rgba(56,189,248,.15); border-color:#38bdf8; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:14px; }
    .card { background:rgba(15,23,42,1); border-radius:16px; overflow:hidden; border:1px solid rgba(30,64,175,.7); cursor:pointer; }
    .thumb { width:100%; padding-top:75%; position:relative; background:radial-gradient(circle at top, #1f2937, #020617); }
    .thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .meta { padding:10px 12px; }
    .title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .muted { opacity:.8; font-size: 12px; }
    .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .pager { margin-top:16px; display:flex; justify-content:center; gap:6px; }
    .page-btn { min-width:28px; height:28px; border-radius:999px; border:1px solid rgba(148,163,184,.6); background:rgba(15,23,42,1); color:#e5e7eb; cursor:pointer; font-size:13px; }
    .page-btn.active { background:#22c55e; color:#022c22; border:none; }
    .tag-row { margin-top:4px; display:flex; flex-wrap:wrap; gap:4px; }
  </style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="logo" @click="goMain">公益摄影交流平台</div>
    <div class="nav">
      <button class="btn primary">广场</button>
      <button class="btn" @click="goActivity">活动</button>
      <button class="btn" @click="logout">退出登录</button>
    </div>
    <div class="profile" @click="goProfile">
      <div class="avatar">
        <span v-if="!avatarUrl">?</span>
        <img v-else :src="avatarUrl" alt="avatar" />
      </div>
      <div>
        <div style="font-weight:700">{{ displayName }}</div>
        <div class="muted">permission={{ permissionText }}</div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="bar">
      <div class="filters">
        <div class="pill" :class="{active: mode==='s0'}" @click="setMode('s0')">最新作品</div>
        <div class="pill" :class="{active: mode==='s1'}" @click="setMode('s1')">点赞最多</div>
        <div class="pill" :class="{active: mode==='date'}" @click="setMode('date')">指定时间区间</div>
        <button class="btn primary" @click="search">搜索</button>
      </div>
      <div class="muted">对应接口：POST /api/main/uphoto/search（暂未完全实现时，将优雅退化为占位数据）</div>
    </div>

    <div v-if="mode==='date'" style="margin-bottom:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <span class="muted">时间区间：</span>
      <div class="date-input-wrapper" style="position: relative;" @click="() => $event.currentTarget.querySelector('input').click()">
        <input v-model="early" type="date" style="padding:6px 8px; border-radius:10px; border:none; font-size:13px; background:#020617; color:#e5e7eb; border:1px solid rgba(148,163,184,.4); width: 200px; cursor: pointer;" />
        <style>
          input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            background: transparent;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
          }
        </style>
      </div>
      <span class="muted">至</span>
      <div class="date-input-wrapper" style="position: relative;" @click="() => $event.currentTarget.querySelector('input').click()">
        <input v-model="late" type="date" style="padding:6px 8px; border-radius:10px; border:none; font-size:13px; background:#020617; color:#e5e7eb; border:1px solid rgba(148,163,184,.4); width: 200px; cursor: pointer;" />
      </div>
      <button class="btn" style="margin-left:4px;" @click="search">应用</button>
    </div>

    <div style="margin-bottom:10px; display:flex; flex-wrap:wrap; gap:6px;">
      <span class="muted">标签：</span>
      <span
        v-for="t in labelDefs"
        :key="t.value"
        class="pill-outline"
        :class="{active: label === t.value}"
        @click="toggleLabel(t.value)"
      >{{ t.text }}</span>
    </div>

    <div class="grid">
      <div v-for="p in pageItems" :key="p.fakeId" class="card" @click="openDetail(p.upthoto_id)">
        <div class="thumb">
          <img v-if="p.uphoto" :src="photoUrl(p.uphoto)" alt="photo" />
        </div>
        <div class="meta">
          <div class="title">{{ p.uphoto_title || '未命名作品' }}</div>
          <div style="display: flex; align-items: center; gap: 6px; margin-top: 4px;">
            <div class="avatar" style="width: 20px; height: 20px; border-radius: 8px;">
              <span v-if="!p.avatar">?</span>
              <img v-else :src="photoUrl(p.avatar)" alt="avatar" />
            </div>
            <span class="muted">{{ p.username || ('用户' + (p.uid || '0')) }}</span>
            <span style="margin-left: auto; font-size: 12px; color: #f97316;">❤️ {{ p.uphoto_like_count || 0 }}</span>
          </div>
          <div class="tag-row">
            <span class="pill-outline" v-for="tag in p._tags" :key="tag">{{ tag }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="pager" v-if="totalPages > 1">
      <button
        v-for="n in totalPages"
        :key="n"
        class="page-btn"
        :class="{active: page === n}"
        @click="page = n"
      >{{ n }}</button>
    </div>
  </div>
</div>

<script>
const { createApp, ref, computed } = Vue;

createApp({
  setup() {
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    let activityId = null;
    for (let i = 0; i < pathParts.length; i++) {
      if (pathParts[i] === 'activity' && pathParts[i + 1]) {
        activityId = Number(pathParts[i + 1]);
        break;
      }
    }

    const uid = Number(localStorage.getItem('pwps_uid') || 0);
    const permission = Number(localStorage.getItem('pwps_permission') || 2);
    const loginname = localStorage.getItem('pwps_loginname') || '';
    const avatarPath = localStorage.getItem('pwps_avatar') || '';

    const displayName = computed(() => uid ? (loginname || ('用户' + uid)) : '游客模式');
    const permissionText = computed(() => permission === 0 ? '管理员' : (permission === 1 ? '普通用户' : '游客'));
    const avatarUrl = computed(() => avatarPath ? ('/' + avatarPath.replace(/^\/+/, '')) : '');

    const mode = ref('s0');
    const label = ref(null);
    const early = ref('');
    const late = ref('');

    const page = ref(1);
    const pageSize = 20;
    const list = ref([]);

    const labelDefs = [
      { value: 0, text: '其他' },
      { value: 1, text: '记录' },
      { value: 2, text: '艺术' },
      { value: 3, text: '商业' },
      { value: 4, text: '人像' },
      { value: 5, text: '天文' },
      { value: 6, text: '航拍' },
      { value: 7, text: '城景' },
      { value: 8, text: '随手拍' },
      { value: 9, text: '旅拍' }
    ];

    const labelText = (v) => {
      const found = labelDefs.find(x => x.value === v);
      return found ? found.text : '标签' + v;
    };

    const buildPayload = () => {
      let s1 = 1;
      if (mode.value === 's1') s1 = 2;

      return {
        uid: uid || 0,
        activity_id: activityId || null,
        main_uphoto_search_1: s1,
        main_uphoto_search_2: label.value !== null ? label.value : null,
        main_uphoto_search_3_earlydate: early.value || null,
        main_uphoto_search_3_latedate: late.value || null
      };
    };

    const search = async () => {
      try {
        // 验证日期是否合法
        if (early.value && late.value) {
          const startDate = new Date(early.value);
          const endDate = new Date(late.value);
          if (endDate < startDate) {
            alert('结束日期不能早于开始日期');
            return;
          }
        }
        const payload = buildPayload();
        const resp = await axios.post('/api/main/uphoto/search', payload);
        if (resp.data && resp.data.success && Array.isArray(resp.data.data)) {
          if (resp.data.data.length > 0) {
            list.value = resp.data.data.map((it, idx) => ({
              ...it,
              fakeId: idx,
              _tags: extractTags(it)
            }));
          } else {
            list.value = [];
          }
        } else {
          list.value = [];
        }
        page.value = 1;
      } catch (e) {
        console.warn('调用 /api/main/uphoto/search 失败', e);
        list.value = [];
        page.value = 1;
      }
    };

    const extractTags = (it) => {
      const tags = [];
      for (let i = 0; i <= 9; i++) {
        const key = 'uphoto_label_' + i;
        if (it[key] === 1) tags.push(labelText(i));
      }
      return tags.length ? tags : ['未打标签'];
    };

    const makeFakePhotos = () => {
      const base = [];
      const usernames = ['摄影师小明', '旅行家小红', '艺术爱好者', '摄影新手'];
      for (let i = 0; i < 12; i++) {
        const uid = 10001 + (i % 4);
        base.push({
          fakeId: i,
          upthoto_id: 10000 + i,
          uid: uid,
          username: usernames[i % 4],
          avatar: `picture/avatar/uid_${uid}.png`,
          uphoto: '', // 等后端联通后使用真实图片 URL
          uphoto_title: '示例作品 ' + (i + 1),
          _tags: ['示例', '占位数据']
        });
      }
      return base;
    };

    const totalPages = computed(() => {
      return Math.max(1, Math.ceil(list.value.length / pageSize));
    });

    const pageItems = computed(() => {
      const start = (page.value - 1) * pageSize;
      return list.value.slice(start, start + pageSize);
    });

    const setMode = (m) => {
      mode.value = m;
      search();
    };

    const toggleLabel = (val) => {
      label.value = (label.value === val ? null : val);
      search();
    };

    const photoUrl = (path) => {
      if (!path) return '';
      return '/' + String(path).replace(/^\/+/, '');
    };

    const openDetail = (id) => {
      if (!id) return;
      window.location.href = `/main/uphoto/${id}`;
    };

    const goMain = () => window.location.href = '/main';
    const goActivity = () => window.location.href = '/main/activity/search';

    const goProfile = () => {
      if (!uid) { window.location.href = '/user/login'; return; }
      if (permission === 0) window.location.href = `/main/admin/edit/${uid}`;
      else window.location.href = `/main/user/edit/${uid}`;
    };

    const logout = () => {
      localStorage.removeItem('pwps_uid');
      localStorage.removeItem('pwps_permission');
      localStorage.removeItem('pwps_loginname');
      localStorage.removeItem('pwps_avatar');
      window.location.href = '/user/login';
    };

    // 首次进入默认加载“最新作品”
    search();

    return {
      displayName,
      permissionText,
      avatarUrl,
      mode,
      label,
      early,
      late,
      labelDefs,
      page,
      totalPages,
      pageItems,
      setMode,
      toggleLabel,
      search,
      photoUrl,
      openDetail,
      goMain,
      goActivity,
      goProfile,
      logout
    };
  }
}).mount('#app');
</script>
</body>
</html>
